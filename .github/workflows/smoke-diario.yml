# Smoke diário operacional (SRE) — lê Supabase de produção/staging sem gravar.
# Secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Opcional: ISO_PRO_E2E_TENANT_ID

name: Smoke diario ops

on:
  schedule:
    # 07:00 UTC ≈ 04:00 BRT
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-diario-ops
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke diario
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ISO_PRO_E2E_TENANT_ID: ${{ secrets.ISO_PRO_E2E_TENANT_ID }}
        run: node scripts/smoke-diario-ops.mjs

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diario-log
          path: release/smoke-diario-*.json
          if-no-files-found: ignore
          retention-days: 14
