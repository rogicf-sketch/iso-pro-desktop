# Valida sintaxe e boas praticas dos workflows (.github/workflows).
# https://github.com/rhysd/actionlint
#
# So corre em branch/PR quando os YAML mudam — tags web-v* nao disparam
# (filtro paths nao aplica a push de tag; isso gerava X vermelho em todo deploy).

name: Lint workflows

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
