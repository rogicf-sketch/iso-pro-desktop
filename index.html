<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=iso-pro-brand-4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <title>I.S.O PRO — Gestão de materiais</title>
  </head>
  <body>
    <script>
      (function () {
        var tema = 'campo';
        var valid = /^(padrao|escuro|hibrido|campo|verde|neon|claro)$/;
        function normalize(raw) {
          if (raw === 'claro') return 'hibrido';
          return valid.test(raw) ? raw : null;
        }
        try {
          var raw = localStorage.getItem('iso-pro-desktop-configuracoes-sistema');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && typeof p.tema === 'string') {
              var n = normalize(p.tema);
              if (n) tema = n;
            }
          }
        } catch (e) {
          /* fallback: campo (default da instalacao) */
        }
        document.body.className = 'theme-' + tema;
      })();
    </script>
    <div id="root" data-e2e="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
