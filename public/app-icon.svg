<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ISO PRO">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="55%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#020304"/>
  <rect x="22" y="22" width="468" height="468" rx="84" fill="url(#frame)"/>
  <rect x="36" y="36" width="440" height="440" rx="74" fill="url(#panel)"/>
  <ellipse cx="256" cy="110" rx="140" ry="44" fill="#ffffff" opacity="0.04"/>

  <!-- Marca: barras finas -->
  <g transform="translate(256 132)" filter="url(#softGlow)">
    <rect x="-78" y="-22" width="156" height="8" rx="4" fill="#39ff14"/>
    <rect x="-58" y="-4" width="116" height="10" rx="5" fill="#39ff14"/>
    <rect x="-78" y="16" width="156" height="8" rx="4" fill="#39ff14"/>
  </g>

  <text
    x="256"
    y="248"
    text-anchor="middle"
    fill="url(#ink)"
    font-family="Segoe UI Semibold, Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="700"
    letter-spacing="0.28em"
    filter="url(#softGlow)"
  >ISO</text>

  <rect x="178" y="272" width="156" height="3" rx="1.5" fill="#39ff14" opacity="0.85"/>

  <text
    x="256"
    y="360"
    text-anchor="middle"
    fill="url(#ink)"
    font-family="Segoe UI Semibold, Segoe UI, Arial, sans-serif"
    font-size="78"
    font-weight="700"
    letter-spacing="0.28em"
    filter="url(#softGlow)"
  >PRO</text>
</svg>
